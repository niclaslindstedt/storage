name: lighthouse

# Lighthouse against the built site with thresholds in
# .github/lighthouse/lighthouserc.json, catching the Core Web Vitals
# regressions a static check cannot see.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      # The web drive (apps/drive) is built into the site: it needs the
      # workspace's dependencies and the framework client.
      - run: npm ci --no-audit --no-fund
      - run: make framework
      - run: make website
      - run: npx --yes @lhci/cli@0.15.1 autorun --config=./.github/lighthouse/lighthouserc.json
