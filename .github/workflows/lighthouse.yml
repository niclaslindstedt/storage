name: lighthouse

# §11.3.10 — Lighthouse against the built site with thresholds in
# .github/lighthouse/lighthouserc.json, catching the Core Web Vitals
# regressions a static check cannot see.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: make website
      - run: npx --yes @lhci/cli@0.15.1 autorun --config=./.github/lighthouse/lighthouserc.json
