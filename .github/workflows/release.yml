name: release

# Triggered by the v* tag that version-bump pushes:
#   1. prepare  — regenerate CHANGELOG.md, bump every manifest, commit
#                 `chore(release): …` to main and move the tag onto it
#                 (the only force-push this project allows). Uses the
#                 default GITHUB_TOKEN, whose trigger suppression keeps the
#                 retag from starting a second release run.
#   2. test     — the full suite on the rewritten tag, Linux and macOS.
#   3. publish  — npm packages to GitHub Packages and the multi-arch images
#                 (storage-server, storage-cli) to GHCR, both authenticated with the job's short-lived
#                 GITHUB_TOKEN, with signed SLSA provenance attestations via
#                 the job's OIDC token. No long-lived credential exists.
#   4. github-release — release notes from CHANGELOG.md plus the tarballs.
on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the release commit and the retag
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - id: tag
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Generate changelog
        run: scripts/generate-changelog.sh "${{ steps.tag.outputs.tag }}"
      - name: Update versions
        run: scripts/update-versions.sh "${{ steps.tag.outputs.tag }}"
      - name: Commit, git push and retag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update changelog and versions for ${TAG}"
            git push origin HEAD:main
          fi
          git tag -f "${TAG}" HEAD
          git push origin "${TAG}" --force

  test:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: make framework
      - run: make test

  publish-npm:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GitHub Packages npm registry
      id-token: write # OIDC token for the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: "https://npm.pkg.github.com"
          scope: "@niclaslindstedt"
      - run: npm ci --no-audit --no-fund
      # storage-mcp bundles the framework's self-hosted client from source.
      - run: make framework
      - run: make release
      - name: Pack
        run: |
          mkdir -p pkg
          npm pack --workspace packages/server --pack-destination pkg
          npm pack --workspace packages/testkit --pack-destination pkg
          npm pack --workspace packages/cli --pack-destination pkg
          npm pack --workspace packages/mcp --pack-destination pkg
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: pkg/*.tgz
      - name: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm publish pkg/niclaslindstedt-storage-server-*.tgz
          npm publish pkg/niclaslindstedt-storage-testkit-*.tgz
          npm publish pkg/niclaslindstedt-storage-cli-*.tgz
          npm publish pkg/niclaslindstedt-storage-mcp-*.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarballs
          path: pkg/*.tgz

  publish-image:
    needs: [prepare, test]
    strategy:
      matrix:
        include:
          - image: storage-server
            file: Dockerfile
          - image: storage-cli
            file: packages/cli/Dockerfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # OIDC token for the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  github-release:
    needs: [prepare, publish-npm, publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarballs
          path: pkg
      - name: Extract release notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: scripts/release-notes.sh "${TAG}" > release-notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          body_path: release-notes.md
          files: pkg/*.tgz
